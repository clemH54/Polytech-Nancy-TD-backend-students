openapi: 3.0.3
info:
    title: TODO API
    version: 1.0.0
    description: >
        API de gestion d'une TODO List.
servers:
    -   url: http://localhost:8080
        description: Serveur local de développement

tags:
    -   name: tasks
        description: Opérations sur les tâches

paths:
    /tasks:
        post:
            tags: [ tasks ]
            summary: Créer une tâche
            operationId: createTask
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TaskCreateDTO'
            responses:
                '201':
                    description: Tâche créée avec succès
                    headers:
                        Location:
                            description: URL de la ressource créée
                            schema:
                                type: string
                                example: /tasks/1
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TaskResponseDTO'
                '400':
                    description: Paramètre invalide
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '500':
                    description: Erreur interne du serveur
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
        get:
            tags: [ tasks ]
            summary: Récupérer toutes les tâches
            operationId: getAllTasks
            parameters:
                -   in: query
                    name: todo-only
                    required: false
                    description: Si true, retourne uniquement les tâches non terminées
                    schema:
                        type: boolean
                        example: true
            responses:
                '200':
                    description: Liste des tâches
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TaskResponseDTO'
                '204':
                    description: Aucune tâche trouvée
                '500':
                    description: Erreur interne du serveur
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'

    /tasks/{id}:
        parameters:
            -   in: path
                name: id
                required: true
                description: Identifiant numérique de la tâche
                schema:
                    type: integer
                    minimum: 1
        get:
            tags: [ tasks ]
            summary: Récupérer une tâche
            description: Récupérer une tâche par son identifiant
            operationId: getTaskById
            responses:
                '200':
                    description: Tâche trouvée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TaskResponseDTO'
                '404':
                    description: Tâche non trouvée
                '500':
                    description: Erreur interne du serveur
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
        delete:
            tags: [ tasks ]
            summary: Supprimer une tâche
            operationId: deleteTaskById
            responses:
                '204':
                    description: Tâche supprimée avec succès
                '404':
                    description: Tâche non trouvée
                '500':
                    description: Erreur interne du serveur
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
        put:
            tags: [ tasks ]
            summary: Modifier une tâche
            operationId: updateTaskById
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TaskUpdateDTO'
            responses:
                '204':
                    description: Tâche modifiée avec succès
                '400':
                    description: Paramètre invalide
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'
                '404':
                    description: Tâche non trouvée
                '500':
                    description: Erreur interne du serveur
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorDTO'

components:
    schemas:
        TaskCreateDTO:
            type: object
            description: Données pour créer une tâche (id autogénéré, done initialisé à false)
            required:
                - title
            properties:
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    maxLength: 255
                    nullable: true
                    example: 2L demi-écrémé

        TaskUpdateDTO:
            type: object
            description: Données pour modifier une tâche
            required:
                - title
                - done
            properties:
                title:
                    type: string
                    maxLength: 50
                    example: Acheter du lait
                description:
                    type: string
                    maxLength: 255
                    nullable: true
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    example: false

        TaskResponseDTO:
            type: object
            description: Représentation d'une tâche retournée par l'API
            required:
                - id
                - title
                - done
            properties:
                id:
                    type: integer
                    example: 1
                title:
                    type: string
                    example: Acheter du lait
                description:
                    type: string
                    nullable: true
                    example: 2L demi-écrémé
                done:
                    type: boolean
                    example: false

        ErrorDTO:
            type: object
            description: Erreur retournée en cas de paramètre invalide ou d'erreur interne
            required:
                - field
                - message
            properties:
                field:
                    type: string
                    example: title
                message:
                    type: string
                    example: Le titre ne peut pas dépasser 50 caractères.